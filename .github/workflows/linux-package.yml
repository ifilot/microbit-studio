name: Release packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  WINDOWS_QT_VERSION: '6.9.1'

jobs:
  package:
    if: ${{ github.event_name == 'push' && !github.event.deleted }}
    name: Build Lubuntu 26.04 amd64 package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libudev-dev \
            qt6-base-dev qt6-webengine-dev qt6-webchannel-dev qt6-tools-dev \
            qt6-l10n-tools nodejs npm xz-utils git curl xvfb xauth xdotool

      - name: Prepare bundled offline assets
        run: bash tools/prepare-assets.sh

      - name: Run editor tests
        run: node --test tests/*.test.cjs

      - name: Build and check the Debian package
        id: deb
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMICROBIT_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cpack --config build/CPackConfig.cmake -G DEB

          shopt -s nullglob
          packages=(build/packages/microbit-studio_*_amd64.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo 'Expected exactly one amd64 Debian package.' >&2
            exit 1
          fi
          package=${packages[0]}
          dpkg-deb --info "$package"
          sudo apt-get install -y "./$package"
          udevadm verify /usr/lib/udev/rules.d/99-microbit-studio.rules
          printf 'path=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the installed editor offline
        run: |
          sudo unshare --net bash -ec '
            ip link set lo up
            exec runuser -u "$SUDO_USER" -- xvfb-run -a -s "-screen 0 1280x900x24" node tests/installed-gui.cjs
          '

      - name: Upload the .deb to the workflow run
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.deb.outputs.path }}
          archive: false
          if-no-files-found: error
          overwrite: true

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !github.event.deleted) }}
    name: Build and test Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        id: qt
        with:
          version: ${{ env.WINDOWS_QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Prepare bundled offline assets
        shell: bash
        run: bash tools/prepare-assets.sh

      - name: Build the Windows installer
        id: setup
        shell: pwsh
        env:
          QT_KIT: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'microbit-runtime'
          $inno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $redist = Join-Path $runtime 'vc_redist.x64.exe'
          ./tools/prepare-windows-runtime.ps1 -Destination $runtime -QtVersion $env:WINDOWS_QT_VERSION
          ./tools/build-windows.ps1 -QtRoot $env:QT_KIT -RuntimeDirectory (Join-Path $runtime 'tools') `
              -InnoSetup $inno -VCRedist $redist
          $packages = @(Get-ChildItem 'build-windows/packages' -Filter 'microbit-studio-*-windows-x64-setup.exe')
          if ($packages.Count -ne 1) { throw 'Expected exactly one installer.' }
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify in-place upgrade and offline startup
        shell: pwsh
        env:
          INSTALLER: ${{ steps.setup.outputs.path }}
        run: |
          $inno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $redist = Join-Path $env:RUNNER_TEMP 'microbit-runtime\vc_redist.x64.exe'
          ./tests/windows-installer.ps1 -Installer $env:INSTALLER -InnoSetup $inno -VCRedist $redist

      - name: Upload the installer to the workflow run
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.setup.outputs.path }}
          archive: false
          if-no-files-found: error
          overwrite: true

  release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted }}
    name: Publish tagged GitHub release
    needs: [package, windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download the verified Linux package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist

      - name: Download the verified Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact-id }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${GITHUB_REF_NAME#v}
          deb="dist/microbit-studio_${version}_amd64.deb"
          installer="dist/microbit-studio-${version}-windows-x64-setup.exe"
          test -s "$deb" && test -s "$installer"
          qt_series=${WINDOWS_QT_VERSION%.*}
          qt_source="https://download.qt.io/archive/qt/$qt_series/$WINDOWS_QT_VERSION/single/qt-everywhere-src-$WINDOWS_QT_VERSION.tar.xz"
          gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "The Windows installer includes Qt under LGPL version 3. [Qt $WINDOWS_QT_VERSION corresponding source]($qt_source)." \
            -- "$GITHUB_REF_NAME" "$deb" "$installer"
