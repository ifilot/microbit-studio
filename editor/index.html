<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
    <title>Microbit Studio</title>
    <link rel="stylesheet" href="studio.css">
    <script defer src="/qwebchannel.js"></script>
    <script defer src="/blockly/blockly_compressed.js"></script>
    <script defer src="/blockly/blocks_compressed.js"></script>
    <script defer src="/lessons/catalog.js"></script>
    <script defer src="/lessons/lesson-covers.js"></script>
    <script defer src="/lessons/microbit-display.js"></script>
    <script defer src="locales.js"></script>
    <script defer src="blocks.js"></script>
    <script defer src="lesson-locales.js"></script>
    <script defer src="lessons.js"></script>
    <script defer src="makecode-import.js"></script>
    <script defer src="sprite.js"></script>
    <script defer src="studio.js"></script>
</head>
<body>
<dialog class="tutorial-picker" id="tutorial-picker" aria-labelledby="tutorial-picker-title">
    <header class="tutorial-picker-header">
        <h2 id="tutorial-picker-title" data-message="tutorials"></h2>
        <form method="dialog">
            <button type="submit" data-message="close"></button>
        </form>
    </header>
    <div class="tutorial-grid" id="tutorial-grid"></div>
</dialog>
<main>
    <section class="lesson" id="lesson" aria-labelledby="lesson-title" hidden>
        <div class="lesson-header">
            <h2 id="lesson-title"></h2>
            <div class="lesson-actions">
                <button type="button" id="previous" data-message="previous"></button>
                <button type="button" id="next" data-message="next"></button>
                <button type="button" id="close-lesson" data-message="close"></button>
            </div>
        </div>
        <div class="lesson-content" id="lesson-content" role="group" aria-labelledby="lesson-step-title" tabindex="0">
            <div class="lesson-instructions">
                <div id="lesson-text"></div>
            </div>
            <div class="lesson-examples" id="lesson-examples" hidden></div>
        </div>
    </section>
    <aside class="sidebar">
        <section class="simulation">
            <div class="section-title">
                <h1 data-message="simulator"></h1>
                <span class="board-version">V2.2</span>
            </div>
            <div class="board">
                <img src="microbit-v2.svg" width="498" height="406" alt="" draggable="false">
                <svg id="leds" role="img" class="led-grid" viewBox="0 0 498 406"></svg>
                <button class="board-key" id="button-a" type="button"></button>
                <button class="board-key" id="button-b" type="button"></button>
                <button type="button" id="shake" data-message="shake" hidden></button>
            </div>
            <div class="simulation-actions" id="simulation-actions" role="group">
                <!-- Glyphs from Font Awesome Free 5.0.8 (Fonticons, Inc.), CC BY 4.0.
                     https://fontawesome.com/  https://creativecommons.org/licenses/by/4.0/ -->
                <div class="simulation-playback">
                    <button type="button" id="run-simulator">
                        <svg class="icon-play" viewBox="0 0 448 512" aria-hidden="true">
                            <path transform="translate(0 448) scale(1 -1)"
                                  d="M424.4 233.3L72.4 441.4C43.8 458.3 0 441.9 0 400.1V-16C0 -53.5 40.7 -76.1 72.4 -57.3L424.4 150.7C455.8 169.2 455.9 214.8 424.4 233.3z"/>
                        </svg>
                        <svg class="icon-stop" viewBox="0 32 448 448" aria-hidden="true">
                            <path transform="translate(0 448) scale(1 -1)"
                                  d="M400 416H48C21.5 416 0 394.5 0 368V16C0 -10.5 21.5 -32 48 -32H400C426.5 -32 448 -10.5 448 16V368C448 394.5 426.5 416 400 416z"/>
                        </svg>
                    </button>
                    <button type="button" id="restart">
                        <svg class="icon-sync" viewBox="0 0 512.333 512" aria-hidden="true">
                            <path transform="translate(0 448) scale(1 -1)"
                                  d="M440.935 435.426L444.901 352.66C399.416 406.096 331.674 440 256 440C134.813 440 33.933 353.076 12.296 238.176C10.908 230.807 16.604 224 24.103 224H73.187C78.757 224 83.564 227.842 84.863 233.259C103.407 310.592 172.931 368 256 368C316.8930000000001 368 370.512 337.144 402.1040000000001 290.199L300.5740000000001 295.064C293.7290000000001 295.3920000000001 288.0000000000001 289.9310000000001 288.0000000000001 283.0780000000001V235.6670000000001C288.0000000000001 229.04 293.3730000000001 223.667 300.0000000000001 223.667H500.3330000000001C506.9600000000001 223.667 512.3330000000001 229.04 512.3330000000001 235.6670000000001V436C512.3330000000001 442.627 506.9600000000001 448 500.3330000000001 448H452.9220000000001C446.0690000000001 448 440.6070000000001 442.271 440.9350000000001 435.426zM256 16C195.105 16 141.483 46.858 109.891 93.805L211.759 88.934C218.604 88.607 224.332 94.068 224.332 100.92V148.332C224.332 154.959 218.959 160.332 212.332 160.332H12C5.373 160.332 0 154.959 0 148.332V-52C0 -58.627 5.373 -64 12 -64H59.385C66.248 -64 71.713 -58.255 71.37 -51.401L67.241 31.174C112.725 -22.166 180.405 -56 256 -56C377.187 -56 478.067 30.924 499.704 145.824C501.092 153.193 495.396 160 487.897 160H438.813C433.243 160 428.436 156.158 427.137 150.741C408.593 73.408 339.069 16 256 16z"/>
                        </svg>
                    </button>
                </div>
                <button type="button" id="button-ab" data-message="buttonAB"></button>
            </div>
            <div id="simulation-sensors" class="simulation-sensors" hidden></div>
            <div id="simulation-touch" class="simulation-actions simulation-peripheral" hidden>
                <button type="button" id="touch-logo" data-message="logoControl"></button>
                <button type="button" id="touch-P0">P0</button>
                <button type="button" id="touch-P1">P1</button>
                <button type="button" id="touch-P2">P2</button>
            </div>
            <fieldset class="simulation-peripheral" id="simulation-radio" hidden>
                <legend data-message="radioPeer"></legend>
                <output id="radio-group"></output>
                <form id="radio-text-form">
                    <label><span data-message="radioPeerText"></span><input id="radio-peer-text" maxlength="19" required></label>
                    <button type="submit" data-message="radioPeerSend"></button>
                </form>
                <form id="radio-number-form">
                    <label><span data-message="radioPeerNumber"></span><input id="radio-peer-number" type="number" required></label>
                    <button type="submit" data-message="radioPeerSend"></button>
                </form>
                <output id="radio-output" aria-live="polite"></output>
            </fieldset>
            <table class="simulation-peripheral" id="simulation-log" hidden>
                <caption data-message="logging"></caption>
                <thead><tr><th data-message="timeSeconds"></th><th data-message="lightControl"></th>
                    <th data-message="temperatureControl"></th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </aside>
    <section class="workspace-panel" aria-labelledby="workspace-title">
        <h2 class="workspace-title" id="workspace-title" data-message="workspace"></h2>
        <div id="workspace"></div>
    </section>
</main>
</body>
</html>
